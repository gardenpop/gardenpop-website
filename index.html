<template id="gp-faq-template"><section id="faq" class="gp-faq" aria-labelledby="gp-faq-title"><div class="gp-faq-wrap"><div class="gp-eyebrow">GOOD TO KNOW</div><h2 id="gp-faq-title">Frequently Asked <em>Questions.</em></h2><p class="gp-faq-intro">Punya pertanyaan soal Your Beauty Snack? Jawabannya ada di sini.</p><div class="gp-faq-list"><details class="gp-faq-item"><summary>1. Skinlicious itu apa, sih?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious adalah Your Beauty Snack dari GardenPop, perpaduan kacang, biji-bijian, dan buah kering dalam satu pouch praktis 35 g. Ada roasted almond, walnut, biji labu, biji bunga matahari, cranberry kering, dan kismis hitam. Crunchy, fruity, dan gampang dibawa ke mana-mana buat nemenin aktivitas harianmu.</div></details><details class="gp-faq-item"><summary>2. Benarkah Skinlicious bisa bikin kulit lebih sehat?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious mengandung bahan-bahan yang menyediakan nutrisi untuk melengkapi pola makan seimbang. Vitamin E membantu melindungi sel dari stres oksidatif, omega-3 ALA dari sumber nabati merupakan bagian dari pola makan seimbang, dan zinc berkontribusi pada pemeliharaan kulit normal.<br><br>Tapi, Skinlicious bukan produk perawatan kulit atau solusi instan untuk masalah kulit, ya. Kondisi kulit juga dipengaruhi banyak faktor, termasuk pola makan, tidur, dan paparan sinar matahari.</div></details><details class="gp-faq-item"><summary>3. Kenapa satu pouch cuma 35 g?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Karena praktis dibawa ke mana-mana! Ukurannya pas buat menemani waktu istirahat, perjalanan, atau saat ingin ngemil di sela aktivitas. Satu pouch berisi 185 kkal berdasarkan informasi gizi pada desain kemasan saat ini.</div></details><details class="gp-faq-item"><summary>4. Apa saja bahan Skinlicious? Ada tambahan gula atau pengawet?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious terdiri dari roasted almond, roasted walnut, roasted pumpkin seeds, roasted sunflower seeds, dried cranberries, dan black raisins.<br><br>Kemasan menampilkan klaim vegan, unsalted, dan non-GMO. Untuk informasi gula tambahan, minyak tambahan, pengawet, dan pewarna, kami akan mengikuti spesifikasi bahan dan formula final yang sudah dikonfirmasi.</div></details><details class="gp-faq-item"><summary>5. Berapa kalori dan kandungan gizinya?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Berdasarkan desain informasi nilai gizi saat ini, per pouch 35 g:<br>• Energi: 185 kkal<br>• Lemak total: 14,4 g<br>• Protein: 6 g<br>• Karbohidrat total: 11,3 g<br>• Gula total: 6 g<br>• Serat pangan: 2,7 g<br><br>Skinlicious bisa menjadi salah satu pilihan camilan di antara waktu makan. Kebutuhan energi dan gizi setiap orang berbeda, jadi sesuaikan dengan kebutuhan harianmu.</div></details><details class="gp-faq-item"><summary>6. Boleh makan Skinlicious setiap hari? Kapan hasilnya terlihat?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious bisa dinikmati sebagai bagian dari pola makan yang beragam dan seimbang. Namun, tidak ada waktu pasti untuk melihat perubahan pada kulit dari mengonsumsi camilan ini. Skinlicious bukan pengganti makanan utama maupun perawatan kulit.</div></details><details class="gp-faq-item"><summary>7. Skinlicious aman untuk orang yang punya alergi kacang?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious mengandung almond dan walnut, yang termasuk kacang pohon. Jika kamu memiliki alergi terhadap bahan-bahan tersebut, hindari produk ini. Periksa juga informasi alergen pada kemasan sebelum mengonsumsi.</div></details><details class="gp-faq-item"><summary>8. Ada sachet kecil di dalam pouch. Itu apa?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Itu adalah silica gel desiccant yang membantu menjaga kualitas produk selama penyimpanan. Jangan dimakan dan jangan dibuka. Keluarkan sachet sebelum menikmati camilan. Jika sachet tertelan atau isinya mengenai mulut, ikuti petunjuk pada sachet dan segera minta saran tenaga medis, terutama jika muncul gejala.</div></details><details class="gp-faq-item"><summary>9. Skinlicious boleh dikonsumsi anak-anak?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Skinlicious dirancang dengan positioning camilan dewasa. Produk ini mengandung kacang dan biji-bijian utuh yang dapat menimbulkan risiko tersedak, terutama pada anak kecil. Jangan berikan kepada anak yang belum mampu mengunyah dengan aman. Untuk anak-anak, pertimbangkan usia, kemampuan mengunyah, alergi, dan pengawasan orang dewasa.</div></details><details class="gp-faq-item"><summary>10. Bagaimana dengan ibu hamil, ibu menyusui, atau orang dengan diabetes?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Kebutuhan setiap orang berbeda. Perhatikan kandungan bahan, informasi gizi, dan alergi yang dimiliki. Jika kamu sedang hamil, menyusui, mengelola diabetes, atau memiliki kondisi medis tertentu, konsultasikan pilihan camilan dengan tenaga kesehatan yang menangani kamu.</div></details><details class="gp-faq-item"><summary>11. Bagaimana cara menyimpan Skinlicious? Berapa lama masa simpannya?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Simpan Skinlicious di tempat sejuk dan kering. Setelah dibuka, tutup kembali pouch dengan rapat. Periksa tanggal BEST BEFORE pada kemasan untuk mengetahui batas konsumsi yang tercantum.</div></details><details class="gp-faq-item"><summary>12. Di mana bisa membeli Skinlicious dan berapa harganya?<span class="gp-plus">+</span></summary><div class="gp-faq-answer">Ikuti Instagram kami di <a href="https://www.instagram.com/gardenpopofficial/" target="_blank" rel="noopener noreferrer">@gardenpopofficial</a> untuk mendapatkan informasi terbaru.</div></details></div></div></section></template><script id="gp-faq-mount">(function(){const mount=()=>{let root=document.getEl
